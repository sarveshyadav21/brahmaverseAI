<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🍕</text></svg>" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
    <title>Fastor — Food Ordering</title>
    <script>
      // Immediately unregister any stalled service workers from previous runs
      if ('serviceWorker' in navigator) {
        navigator.serviceWorker.getRegistrations().then(function (registrations) {
          for (var i = 0; i < registrations.length; i++) {
            registrations[i].unregister();
          }
        });
      }
      // If visiting root url '/', immediately redirect to '/signup'
      if (window.location.pathname === '/' || window.location.pathname === '') {
        window.location.replace('/signup');
      }
    </script>
  </head>
  <body class="bg-[#F5F6F8] text-gray-900 antialiased selection:bg-brand selection:text-white">
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
