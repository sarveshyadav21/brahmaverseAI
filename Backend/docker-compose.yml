services:
  db-test:
    image: postgres:16-alpine
    container_name: crm_test_db
    environment:
      POSTGRES_USER: crm_user
      POSTGRES_PASSWORD: crm_pass
      POSTGRES_DB: crm_db_test
    ports:
      - "5433:5432"
    tmpfs:
      - /var/lib/postgresql/data:rw,noexec,nosuid,size=512m
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U crm_user -d crm_db_test"]
      interval: 2s
      timeout: 3s
      retries: 5
    restart: unless-stopped
